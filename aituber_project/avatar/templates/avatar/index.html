{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITuber Control Panel</title>
    <link rel="icon" href="{% static 'avatar/images/【あ】.png' %}">
    <link rel="stylesheet" href="{% static 'avatar/css/style.css' %}">
    <script type="module" src="{% static 'avatar/js/app.js' %}"></script>
</head>

<body>
    <main class="app_layout">

        <!-- =========================
             Left: Live Comments
        ========================== -->
        <section class="panel comment_panel">
            <div class="panel_header">
                <div>
                    <h2>Live Comments</h2>
                    <p class="panel_description">視聴者コメント表示エリア</p>
                </div>

                <span class="live_badge">LIVE</span>
            </div>

            <div class="comment_list" id="commentList">
                <!-- JSでコメントが追加される -->
            </div>
        </section>


        <!-- =========================
             Center: AITuber Controls
        ========================== -->
        <section class="panel control_panel">
            <div class="panel_header">
                <div>
                    <h2>AITuber Controls</h2>
                    <p class="panel_description">AI発話・コメント生成操作</p>
                </div>
            </div>

            <div class="button_grid">
                <button id="generateSuperChatBtn" class="control_button priority_high">
                    スーパーチャット生成
                </button>

                <button id="generateCommentBtn" class="control_button">
                    コメント生成
                </button>

                <button id="generateSelfIntroductionBtn" class="control_button">
                    自己紹介生成
                </button>

                <button id="generateNewsTalkBtn" class="control_button">
                    ニューストーク生成
                </button>

                <button id="generateWeatherTalkBtn" class="control_button">
                    ウェザートーク生成
                </button>
            </div>

            <div class="divider"></div>

            <div class="user_input_area">
                <h3>Manual Comment</h3>

                <div class="user_input">
                    <input
                        id="usernameInput"
                        type="text"
                        placeholder="username"
                        autocomplete="off"
                    >

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="comment"
                        autocomplete="off"
                    >

                    <button id="sendUserCommentBtn" class="send_button">
                        送信
                    </button>
                </div>
            </div>
        </section>


        <!-- =========================
             Right: VTube Studio
        ========================== -->
        <section class="panel vtube_panel">
            <div class="panel_header">
                <div>
                    <h2>VTube Studio</h2>
                    <p class="panel_description">表情・口パク制御</p>
                </div>
            </div>

            <div class="vtube_connection_box">
                <label for="vtubeHost" class="input_label">
                    WebSocket URL
                </label>

                <input
                    id="vtubeHost"
                    type="text"
                    value="ws://localhost:8001"
                    autocomplete="off"
                >

                <button id="connectVTubeBtn" class="connect_button">
                    VTube Studio接続
                </button>
            </div>

            <div class="status_box">
                <div class="status_row">
                    <span class="status_label">接続状態</span>
                    <span id="vtubeStatusText" class="status_value">未接続</span>
                </div>

                <div class="status_row">
                    <span class="status_label">現在の表情</span>
                    <span id="currentExpression" class="status_value">-</span>
                </div>
            </div>

            <div class="hint_box">
                <p>
                    VTube Studioを起動し、Plugin APIを有効化してから接続してください。
                </p>
            </div>
        </section>


        <!-- =========================
             Bottom: Event Queue
        ========================== -->
        <section class="panel queue_panel">
            <div class="panel_header">
                <div>
                    <h2>Event Queue</h2>
                    <p class="panel_description">処理待ちイベント一覧</p>
                </div>
            </div>

            <div class="event_queue" id="eventQueue">
                <!-- JSでイベントが追加される -->
            </div>
        </section>

    </main>
</body>
</html>
